{% extends "base.html" %}

{% block content %}
    <h1 class="text-center my-1">Categories</h1>
    <div class="container py-4">
    <div class="row row-cols-1 md:row-cols-2 lg:row-cols-3 xl:row-cols-4 g-4">

    {% for category in categories %}
        <div class="col">
          <div class="card h-100">
            <img src="{{category.image_url}}" class="card-img-top object-fit-contain" height="200px">
            <div class="card-body">
              <h5 class="card-title">{{category.name}}</h5>
            </div>
            <div class="card-footer">
              <small class="text-body-secondary"><a href="{{url_for('list_products', category=category.name)}}">View Products</a> | <a href="{{url_for('list_manufacturers', category=category.name)}}">View Manufacturers</a></small>
            </div>
          </div>
        </div>
    {% endfor %}
    </div>
</div>
{% endblock %}
